html/head_include="<style>body{background:#000;}</style>
<script>
/* Sound on phones (as in lazarus-revibed): resume Web Audio on every tap, click or key (browsers
   suspend it after calls or app switches) and let it play while an iPhone is in silent mode. */
(function () {
  var A = window.AudioContext || window.webkitAudioContext;
  if (!A) return;
  var ctxs = [];
  var P = class extends A { constructor(o) { super(o); ctxs.push(this); } };
  window.AudioContext = P;
  if (window.webkitAudioContext) window.webkitAudioContext = P;
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
  var ios = navigator.maxTouchPoints > 0 && /iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent);
  var silent = null;
  function unlock() {
    ctxs.forEach(function (c) { if (c.state !== 'running' && c.state !== 'closed') c.resume().catch(function () {}); });
    if (ios && !navigator.audioSession && !silent) {
      silent = document.createElement('audio');
      silent.setAttribute('x-webkit-airplay', 'deny');
      silent.loop = true;
      silent.src = 'data:audio/wav;base64,UklGRogAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YWQAAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICA';
      silent.play().catch(function () { silent = null; });
    }
  }
  ['pointerup', 'touchend', 'click', 'keydown'].forEach(function (t) { window.addEventListener(t, unlock, true); });
})();
</script>
<script>
/* Updates: the offline copy (service worker) serves the game from its cache and a new version
   would wait until every page of the game is closed, which on phones may be never. When a new
   version is installed, ask it to take over at once; it then reloads the page. */
(function () {
  if (!('serviceWorker' in navigator)) return;
  function promote(w) { if (w && navigator.serviceWorker.controller) w.postMessage('update'); }
  navigator.serviceWorker.ready.then(function (reg) {
    if (reg.waiting) promote(reg.waiting);
    reg.addEventListener('updatefound', function () {
      var w = reg.installing;
      if (w) w.addEventListener('statechange', function () { if (w.state === 'installed') promote(w); });
    });
    reg.update().catch(function () {});
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible') reg.update().catch(function () {});
    });
  });
})();
</script>"
