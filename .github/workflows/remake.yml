# Tests the Godot remake, exports the web build and (from main) publishes it on GitHub Pages.
# One-time setup for publishing: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Remake

on:
  push:
    paths: ["remake/**", "tools/**", "tests/**", ".github/workflows/remake.yml"]
  pull_request:
    paths: ["remake/**", "tools/**", "tests/**", ".github/workflows/remake.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: remake-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python tests and generated data up to date
        run: |
          pip install -r tools/requirements.txt
          python3 tests/test_sim.py
          python3 tools/build_remake_data.py original/ /tmp/data
          python3 tools/make_golden_traces.py original/LEVELS.HL tests/golden_scenarios.json /tmp/data/golden_traces.json
          for f in /tmp/data/*.json /tmp/data/LEVELS.HL /tmp/data/sounds.bin; do cmp "$f" "remake/data/$(basename "$f")"; done

      - name: Install Godot and the web export templates
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -sSLo godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          curl -sSLo templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest"
          unzip -q -j templates.tpz templates/version.txt templates/web_nothreads_release.zip \
            templates/web_nothreads_debug.zip -d "$dest"
          rm godot.zip templates.tpz

      - name: Import the project
        run: godot --headless --path remake --import || true

      - name: Godot tests (scripts, rules, golden traces, scenarios)
        run: |
          godot --headless --path remake --script res://tests/check.gd
          godot --headless --path remake --script res://tests/rules.gd
          godot --headless --path remake --script res://tests/golden.gd
          godot --headless --path remake --script res://tests/scenarios.gd

      - name: Rendering matches the original's screenshot pixel for pixel
        run: |
          mkdir -p /tmp/render
          godot --headless --path remake --script res://tests/render_dump.gd -- /tmp/render
          python3 tools/compare_render.py /tmp/render/level01.png docs/images/original/05_level01.png --ignore-hearts 1

      - name: Export the web build
        run: |
          mkdir -p remake/build/web && touch remake/build/.gdignore
          godot --headless --path remake --export-release Web "$GITHUB_WORKSPACE/remake/build/web/index.html"
          test -s remake/build/web/index.wasm

      - name: Web smoke test (headless Chromium, desktop and phone)
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          node remake/tests/web_smoke.mjs remake/build/web /tmp/web-shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-shots
          path: /tmp/web-shots

      - uses: actions/upload-pages-artifact@v3
        with:
          path: remake/build/web

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
